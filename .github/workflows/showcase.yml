name: Showcase

# Publishes the showcase to GitHub Pages
# (https://ensolabs.github.io/designsystemet-elm/). Pages must be set to
# "GitHub Actions" in the repository settings.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the showcase
        run: bun run showcase:build

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
